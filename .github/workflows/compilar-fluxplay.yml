name: Compilar APK FluxPlay SDK 36

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths:
      - "FluxPlay-Android-v1.zip"
      - ".github/workflows/compilar-fluxplay.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Comprobar archivo del proyecto
        run: |
          if [ ! -f "FluxPlay-Android-v1.zip" ]; then
            echo "ERROR: No se encontró FluxPlay-Android-v1.zip"
            exit 1
          fi

          echo "Archivo del proyecto encontrado correctamente."

      - name: Descomprimir proyecto
        run: |
          rm -rf _build
          mkdir -p _build
          unzip -q "FluxPlay-Android-v1.zip" -d _build

          SETTINGS_FILE=$(find _build -type f \( \
            -name "settings.gradle.kts" -o \
            -name "settings.gradle" \
          \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No se encontró el proyecto Android dentro del ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $PROJECT_DIR"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceptar licencias de Android
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Instalar Android 16 API 36
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Preparar APK
        run: |
          APK_ORIGINAL="${PROJECT_DIR}/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_ORIGINAL" ]; then
            echo "ERROR: La compilación terminó, pero no se encontró el APK."
            find "$PROJECT_DIR" -type f -name "*.apk" || true
            exit 1
          fi

          cp "$APK_ORIGINAL" "FluxPlay-SDK36.apk"
          echo "APK preparado correctamente."

      - name: Subir APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: FluxPlay-SDK36-APK
          path: FluxPlay-SDK36.apk
          if-no-files-found: error
          retention-days: 30
