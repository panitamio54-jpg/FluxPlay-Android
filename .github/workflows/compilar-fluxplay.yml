name: Compilar APK FluxPlay SDK 36

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "FluxPlay-Android-v1.zip"
      - ".github/workflows/compilar-fluxplay.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Comprobar archivo del proyecto
        run: |
          test -f FluxPlay-Android-v1.zip

      - name: Descomprimir proyecto
        run: |
          rm -rf _build
          mkdir -p _build
          unzip -q FluxPlay-Android-v1.zip -d _build

          SETTINGS_FILE=$(find _build -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No se encontró el proyecto Android dentro del ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $PROJECT_DIR"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Preparar APK
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" FluxPlay-v1.apk
          ls -lh FluxPlay-v1.apk

      - name: Subir APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: FluxPlay-v1-APK
          path: FluxPlay-v1.apk
          if-no-files-found: error
          retention-days: 30
