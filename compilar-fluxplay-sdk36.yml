name: Compilar APK FluxPlay API 36

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - "FluxPlay-Android-v1.zip"
      - ".github/workflows/compilar-fluxplay.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Comprobar archivo del proyecto
        run: test -f FluxPlay-Android-v1.zip

      - name: Descomprimir proyecto
        run: |
          rm -rf _build
          mkdir _build
          unzip -q FluxPlay-Android-v1.zip -d _build
          PROJECT_DIR=$(dirname "$(find _build -name settings.gradle.kts -type f | head -n 1)")
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "No se encontró el proyecto Android dentro del ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $PROJECT_DIR"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android 16 (API 36)
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Preparar APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" FluxPlay-v1.apk

      - name: Subir APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: FluxPlay-v1-APK
          path: FluxPlay-v1.apk
          if-no-files-found: error
          retention-days: 30
